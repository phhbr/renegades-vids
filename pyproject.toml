[project]
name = "playsplit"
version = "0.1.0"
description = "Split flag football game recordings into one video file per play."
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "matplotlib>=3.8",
    "jinja2>=3.1",
    "rich>=13.7",
    "typer>=0.12",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
detect = ["ultralytics>=8.3", "torch>=2.3", "torchvision>=0.18"]

[project.scripts]
playsplit = "playsplit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playsplit"]
